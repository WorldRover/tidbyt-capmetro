name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixlet
        run: |
          PIXLET_VERSION=$(curl -s https://api.github.com/repos/tidbyt/pixlet/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          PIXLET_VERSION_NUM=${PIXLET_VERSION#v}
          curl -fsSL "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_VERSION}/pixlet_${PIXLET_VERSION_NUM}_linux_amd64.tar.gz" -o pixlet.tar.gz
          tar -xzf pixlet.tar.gz pixlet
          sudo mv pixlet /usr/local/bin/

      - name: Check formatting
        run: |
          pixlet format CapMetro.star
          git diff --exit-code CapMetro.star
