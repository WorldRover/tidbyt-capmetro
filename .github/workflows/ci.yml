name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pixlet
        run: |
          PIXLET_VERSION=$(curl -s https://api.github.com/repos/tidbyt/pixlet/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          PIXLET_VERSION_NUM=${PIXLET_VERSION#v}
          curl -fsSL "https://github.com/tidbyt/pixlet/releases/download/${PIXLET_VERSION}/pixlet_${PIXLET_VERSION_NUM}_linux_amd64.tar.gz" -o pixlet.tar.gz
          tar -xzf pixlet.tar.gz pixlet
          sudo mv pixlet /usr/local/bin/

      - name: Check formatting
        run: |
          pixlet format capmetro.star
          git diff --exit-code capmetro.star

      # `pixlet format` never executes the applet, so it cannot catch a load
      # error (e.g. a function shadowing a loaded module) or a runtime crash.
      # These renders exercise both the departures path and the empty path.
      - name: Render (default stop)
        run: pixlet render capmetro.star -o /tmp/default.webp

      - name: Render (multiple stops)
        run: pixlet render capmetro.star stop_1=603 stop_2=5865 stop_3=1042 -o /tmp/multi.webp

      - name: Render (no departures)
        run: pixlet render capmetro.star stop_1=999999 -o /tmp/empty.webp

      - name: Verify renders produced output
        run: |
          for f in /tmp/default.webp /tmp/multi.webp /tmp/empty.webp; do
            test -s "$f" || { echo "::error::$f is empty or missing"; exit 1; }
          done
